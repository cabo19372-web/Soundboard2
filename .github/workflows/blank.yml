
name: Build Soundboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar e extrair projeto
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Nenhum arquivo ZIP encontrado!"
            exit 1
          fi

          echo "Extraindo: $ZIP_FILE"

          unzip -o "$ZIP_FILE" \
            -x '.github/workflows/*' 'README.md' -d .

          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle --no-daemon clean assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Soundboard-v0.2.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
